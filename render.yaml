services:
  - type: web
    name: chatty-real-time-chat-app
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: ALLOW_IN_MEMORY
        value: "true"
      - key: DATABASE_URL
        sync: false
